[workspace]
resolver = "3"
members = ["crates/magnet-core", "crates/magnet-hook", "crates/winmagnet"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
magnet-core = { path = "crates/magnet-core" }
windows-sys = "0.61"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
